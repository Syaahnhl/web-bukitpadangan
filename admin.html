<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard &amp; CMS - Warung Makan Bukit Padangan</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/admin.css?v=20261111">
</head>

<body class="admin-body">

    <!-- Auth gate (login & emergency recovery) -->
    <div data-component="components/admin/auth-gate.html"></div>

    <!-- Admin main workspace -->
    <div class="admin-app-workspace" id="adminAppWorkspace">
        <div class="admin-sidebar-backdrop" id="adminSidebarBackdrop" onclick="closeAdminSidebar()"></div>

        <!-- SIDEBAR DRAWER -->
        <div data-component="components/admin/sidebar.html"></div>

        <!-- MAIN CONTENT WRAPPER -->
        <div class="admin-main-wrap" id="adminMainWrap">
            <!-- SLIM TOPBAR -->
            <header class="admin-topbar-wrapper">
                <div class="topbar-header-row">
                    <div class="topbar-left-cluster">
                        <button type="button" class="btn-sidebar-toggle" id="btnSidebarToggle" onclick="toggleAdminSidebar()" title="Buka/Tutup Menu Navigasi" aria-label="Menu Navigasi">
                            <i class="fas fa-bars"></i>
                        </button>
                        <div class="topbar-brand">
                            <div class="brand-logo-icon"><i class="fas fa-mountain-sun"></i></div>
                            <div class="brand-info">
                                <div class="brand-title-wrap"><h1 class="brand-title">Bukit Padangan</h1></div>
                                <span class="brand-subtitle" id="topbarSectionSubtitle">Portal Pengelola</span>
                            </div>
                        </div>
                    </div>
                    <div class="topbar-actions">
                        <a href="index.html" class="btn-topbar-profile" title="Kembali ke Web Profil Bukit Padangan">
                            <i class="fas fa-arrow-left"></i>
                            <span class="btn-profile-label">Kembali ke Web</span>
                        </a>
                    </div>
                </div>
            </header>

            <!-- TABS CONTAINER -->
            <div class="app-content-container">
                <div data-component="components/admin/tab-overview.html"></div>
                <div data-component="components/admin/tab-content.html"></div>
                <div data-component="components/admin/tab-menu.html"></div>
                <div data-component="components/admin/tab-gallery.html"></div>
                <div data-component="components/admin/tab-tables.html"></div>
                <div data-component="components/admin/tab-settings.html"></div>
            </div>
        </div>
    </div>

    <!-- Modals & toast -->
    <div data-component="components/admin/modal-menu.html"></div>
    <div data-component="components/admin/modal-gallery.html"></div>
    <div data-component="components/admin/toast.html"></div>

    <!-- Modular scripts -->
    <script src="js/component-loader.js?v=20261111"></script>
    <script src="js/admin-auth.js?v=20261111"></script>
    <script src="js/admin-cms.js?v=20261111"></script>
    <script src="js/admin-menu.js?v=20261111"></script>
    <script src="js/admin-gallery.js?v=20261111"></script>
    <script src="js/admin-tables.js?v=20261111"></script>
</body>
</html>
